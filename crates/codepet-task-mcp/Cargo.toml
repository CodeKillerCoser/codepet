[package]
name = "codepet-task-mcp"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
codepet-paths = { path = "../codepet-paths" }
codepet-task-lineage = { path = "../codepet-task-lineage" }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "signal"] }
tokio-util = "0.7"
axum = "0.7"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
