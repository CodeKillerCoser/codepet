[package]
name = "codepet-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
codepet-gateway-sdk = { path = "../../sdk/rust/codepet-gateway-sdk", version = "0.1.0" }
codepet-provider-sdk = { path = "../../sdk/rust/codepet-provider-sdk", version = "0.1.0" }
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.24"

[[bin]]
name = "codepet-host-fake-provider"
path = "tests/fixtures/fake_provider.rs"
