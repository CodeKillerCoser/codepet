[package]
name = "codepet-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
codepet-provider-data = { path = "../providers/codepet-provider-data" }
codepet-pet-sdk = { path = "../../sdk/rust/codepet-pet-sdk" }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
codepet-gateway-sdk = { path = "../../sdk/rust/codepet-gateway-sdk", version = "0.1.0" }
codepet-lan-channel-sdk = { path = "../../sdk/rust/codepet-lan-channel-sdk", version = "0.1.0" }
codepet-provider-sdk = { path = "../../sdk/rust/codepet-provider-sdk", version = "0.1.0" }
futures-util = "0.3"
netdev = { version = "0.46", default-features = false }
mdns-sd = { version = "0.21", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
x509-parser = { version = "0.18", features = ["verify"] }
yawc = { version = "=0.2.0", default-features = false, features = ["axum"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.24"

[[bin]]
name = "codepet-host-fake-provider"
path = "tests/fixtures/fake_provider.rs"
