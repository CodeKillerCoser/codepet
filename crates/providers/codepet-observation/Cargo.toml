[package]
name = "codepet-observation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
codepet-provider-sdk = { path = "../../../sdk/rust/codepet-provider-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
axum = "0.7"
dirs = "6"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
