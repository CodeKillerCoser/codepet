[package]
name = "codepet-provider-data"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fs2 = "0.4"
ring = "0.17"
tokio = { version = "1", features = ["rt", "sync", "time"] }
codepet-provider-sdk = { path = "../../../sdk/rust/codepet-provider-sdk" }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
