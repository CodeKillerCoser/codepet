[package]
name = "codepet-task-lineage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
codepet-provider-sdk = { path = "../../sdk/rust/codepet-provider-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
