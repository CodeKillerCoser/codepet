<div id="cp-final" aria-label="Code Pet · UI 设计稿" data-platform="macos">

<script>
(()=>{
const root=document.getElementById('cp-final'), content=root.querySelector('.cp-content'), main=root.querySelector('.cp-main'), drawer=root.querySelector('.cp-drawer'), scrim=root.querySelector('.cp-scrim'), toast=root.querySelector('.cp-toast');
const state={theme:'system',scenario:'normal',page:'Agent',density:'comfortable',titleTags:['测试任务'],contentTags:[],notification:'响铃',drawer:null};
const platformState={platform:'macos'};
if(globalThis.Tweak){const platformTweak=new Tweak({container:root.querySelector('.cp-window-toolbar'),onChange:()=>{root.dataset.platform=platformState.platform}});platformTweak.addSelect(platformState,'platform',{label:'平台',options:[{label:'macOS · 左上角红黄绿',value:'macos'},{label:'Windows · 右上角窗口按钮',value:'windows'}]})}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action="toggle-sidebar"]');if(!b)return;const collapsed=root.classList.toggle('cp-sidebar-collapsed');b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',collapsed?'展开导航栏':'收起导航栏')});
const providers=[{name:'Codex',icon:'box',detail:'通过 Runtime Gateway 跟随 Codex Desktop',path:'C:\\Users\\alex\\.codex',channel:'Runtime Gateway',legacy:true},{name:'Claude Code',icon:'terminal',detail:'通过 Provider 接收任务活动',path:'C:\\Users\\alex\\.claude',channel:'Provider',legacy:false},{name:'Cursor',icon:'mouse-pointer-2',detail:'配置接入后，显示任务活动',path:'',channel:'Hook',legacy:false},{name:'Qoder',icon:'code-2',detail:'配置接入后，显示任务活动',path:'',channel:'Hook',legacy:false}];
let toastTimer,returnFocus=null,modalFocus=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.75}})}
function status(i){if(state.scenario==='empty'||i>1)return {label:'未接入',cls:'off',icon:'circle-dashed'};if(state.scenario==='error'&&i===1)return {label:'连接异常',cls:'error',icon:'circle-alert'};return {label:'已接入',cls:'',icon:'check'}}
function badge(i){let s=status(i);return `<span class="cp-badge ${s.cls}">${icon(s.icon)}${s.label}</span>`}
function render(){root.style.colorScheme=state.theme==='system'?'light dark':state.theme;root.dataset.density=state.density;root.querySelector('h1').textContent=state.page;root.querySelector('.cp-mobile-nav').value=state.page;root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
if(state.page==='Agent')agent();else if(state.page==='连接')connections();else if(state.page==='个性化')personalize();else if(state.page==='事件')events();else content.innerHTML=`<div class="cp-empty">${icon('chart-no-axes-column')}<h2>暂无用量记录</h2><p>接入支持用量统计的工具后，在这里查看。</p><button style="margin-top:20px" class="cp-button" data-page="Agent">查看接入状态</button></div>`;
if(state.drawer!==null)renderDrawer();icons();}
function agent(){const isError=state.scenario==='error',empty=state.scenario==='empty';content.innerHTML=`
<div class="cp-statusline"><span class="cp-statusmark ${isError?'alert':empty?'empty':''}">${icon(isError?'circle-alert':empty?'plug':'check')}</span><div><h2>${isError?'1 个接入需要检查':empty?'连接你的第一个 Agent':'接入正常'}</h2><p>${isError?'Claude Code 连接中断，其他接入不受影响。':empty?'配置接入后，在桌宠中查看任务活动。':'2 / 4 个 Agent 已接入 · 等待新的任务活动'}</p></div></div>
<div class="cp-section-top"><h2>Agent 接入</h2><span class="cp-muted">本机</span></div>
<div>${providers.map((p,i)=>`<article class="cp-provider"><span class="cp-provider-icon">${icon(p.icon)}</span><div><div class="cp-provider-name"><strong>${p.name}</strong>${badge(i)}</div><p class="cp-provider-meta">${i===1&&isError?'未收到连接响应，请查看接入详情':p.detail}</p></div><div class="cp-row-actions"><button class="cp-button ${status(i).cls==='error'?'cp-primary':status(i).cls==='off'?'':'cp-quiet'}" data-provider="${i}">${status(i).cls==='error'?'检查连接':status(i).cls==='off'?'查看配置':'查看详情'}${icon('chevron-right')}</button></div></article>`).join('')}</div>
<section class="cp-section"><div class="cp-section-top"><h2>任务过滤</h2><button class="cp-button cp-quiet" data-action="clear" ${state.titleTags.length+state.contentTags.length?'':'disabled'}>${icon('trash-2')}清空</button></div><p class="cp-section-desc">管理用于过滤任务的标题和内容关键词。</p>${filterRow('title','标题',state.titleTags)}${filterRow('content','内容',state.contentTags)}</section>
<section class="cp-section"><div class="cp-setting"><div><h2>授权提醒</h2><p>任务需要你批准时的提醒方式</p></div><select class="cp-input" aria-label="授权提醒" data-setting="notification"><option ${state.notification==='响铃'?'selected':''}>响铃</option><option ${state.notification==='静音'?'selected':''}>静音</option></select></div></section>
<div class="cp-footnote">${icon('shield-check')}接入与通知设置仅用于当前设备。</div>`;}
function filterRow(key,label,tags){return `<form class="cp-filter" data-filter="${key}"><div class="cp-formrow"><label for="cp-${key}">${label}</label><input class="cp-input" id="cp-${key}" name="keyword" placeholder="添加${label}关键词" autocomplete="off" aria-describedby="cp-${key}-error"><button class="cp-button" type="submit">添加</button></div><p class="cp-error" id="cp-${key}-error" role="alert" hidden></p></form><div class="cp-chips">${tags.map((t,i)=>`<span class="cp-chip">${esc(t)}<button data-remove="${key}" data-index="${i}" aria-label="移除 ${esc(t)}">${icon('x')}</button></span>`).join('')}</div>`}
function connections(){content.innerHTML=`<div class="cp-statusline"><span class="cp-statusmark">${icon('check')}</span><div><h2>本机服务可用</h2><p>接收当前设备上的任务事件</p></div></div><h2>本机接入</h2><div class="cp-setting"><div><h3>事件接收地址</h3><p>仅监听本机回环地址</p></div><span class="cp-badge">${icon('check')}运行中</span></div><code class="cp-code">http://127.0.0.1:47621/hook</code><div class="cp-section"><h2>Agent 连接</h2><p class="cp-section-desc">每个工具的接入方式和状态可在详情中查看。</p>${providers.map((p,i)=>`<div class="cp-setting"><div><h3>${p.name}</h3>${badge(i)}</div><button class="cp-button" data-provider="${i}">查看详情${icon('chevron-right')}</button></div>`).join('')}</div>`}
function personalize(){content.innerHTML=`<h2>外观</h2><p class="cp-section-desc">为主窗口选择适合你的显示方式。</p><div class="cp-setting"><div><h3>主题</h3><p>系统模式跟随设备的外观设置</p></div></div><div class="cp-theme-options" style="margin:16px 0 32px">${[['system','系统','monitor'],['light','浅色','sun'],['dark','深色','moon']].map(([v,l,i])=>`<button class="cp-button" data-theme="${v}" aria-pressed="${state.theme===v}">${icon(i)}${l}</button>`).join('')}</div><h2>声音</h2><div class="cp-setting"><div><h3>授权提醒</h3><p>任务需要批准时提醒你</p></div><select class="cp-input" aria-label="授权提醒" data-setting="notification"><option ${state.notification==='响铃'?'selected':''}>响铃</option><option ${state.notification==='静音'?'selected':''}>静音</option></select></div>`}
function events(){content.innerHTML=`<div class="cp-section-top"><h2>最近活动</h2><span class="cp-muted">本机</span></div>${state.scenario==='empty'?`<div class="cp-empty">${icon('activity')}<h2>还没有任务事件</h2><p>Agent 接入后，新的活动将在这里显示。</p></div>`:`<div class="cp-event">${icon(state.scenario==='error'?'circle-alert':'plug')}<div><h3>${state.scenario==='error'?'Claude Code 连接中断':'Claude Code 已接入'}</h3><p class="cp-muted">${state.scenario==='error'?'等待重新建立连接':'可以接收新的任务活动'}</p></div><time>刚刚</time></div><div class="cp-event">${icon('plug')}<div><h3>Codex 已接入</h3><p class="cp-muted">通过 Runtime Gateway 跟随桌面端</p></div><time>2 分钟前</time></div>`}`}
function openDrawer(i,trigger){returnFocus=trigger;state.drawer=i;renderDrawer();main.classList.add('has-drawer');drawer.hidden=false;icons();drawer.querySelector('[data-action="close-drawer"]').focus()}
function renderDrawer(){let i=state.drawer,p=providers[i],s=status(i);drawer.innerHTML=`<div class="cp-drawer-head"><h2>接入详情</h2><button class="cp-button cp-quiet cp-icon" data-action="close-drawer" aria-label="关闭详情">${icon('x')}</button></div><div class="cp-drawer-body"><div class="cp-detail-title"><span class="cp-provider-icon">${icon(p.icon)}</span><strong>${p.name}</strong></div>${badge(i)}<p class="cp-detail-label">接入方式</p><p>${p.channel}</p><p class="cp-detail-label">${s.cls==='off'?'配置说明':'配置目录'}</p>${s.cls==='off'?`<p style="font-size:13px">在 ${p.name} 中完成对应接入配置后，Code Pet 将显示连接状态。</p>`:`<code class="cp-code">${esc(p.path)}</code>`}<p class="cp-detail-label">任务活动</p><p style="font-size:13px">${s.cls==='error'?'连接中断，暂时无法接收新活动':s.cls==='off'?'等待接入':'等待新的任务事件'}</p>${s.cls==='error'?`<div class="cp-note" style="color:var(--cp-red)">确认 ${p.name} 正在运行，随后重新检查连接状态。</div>`:''}${p.legacy?'<div class="cp-note">旧 Codex Hook 已停用。当前任务活动通过 Runtime Gateway 跟随桌面端，旧 Hook 状态不影响当前接入。</div>':''}</div><div class="cp-drawer-foot"><button class="cp-button" data-action="close-drawer">关闭</button><button class="cp-button cp-primary" data-action="recheck">${icon('refresh-cw')}检查状态</button></div>`;drawer.hidden=false;main.classList.add('has-drawer')}
function closeDrawer(){state.drawer=null;drawer.hidden=true;main.classList.remove('has-drawer');if(returnFocus?.isConnected)returnFocus.focus()}
function notify(message){clearTimeout(toastTimer);toast.innerHTML=`${icon('circle-check')}<span>${esc(message)}</span><button class="cp-button cp-quiet cp-icon" data-action="dismiss-toast" aria-label="关闭提示">${icon('x')}</button>`;toast.hidden=false;icons();toastTimer=setTimeout(()=>toast.hidden=true,4000)}
toast.addEventListener('mouseenter',()=>clearTimeout(toastTimer));toast.addEventListener('mouseleave',()=>toastTimer=setTimeout(()=>toast.hidden=true,4000));toast.addEventListener('focusin',()=>clearTimeout(toastTimer));toast.addEventListener('focusout',()=>toastTimer=setTimeout(()=>toast.hidden=true,4000));
function closeModal(){scrim.hidden=true;root.querySelector('.cp-shell').inert=false;if(modalFocus?.isConnected)modalFocus.focus()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){closeDrawer();state.page=b.dataset.page;render();return}if(b.dataset.theme){state.theme=b.dataset.theme;render();return}if(b.dataset.provider!==undefined){openDrawer(Number(b.dataset.provider),b);return}if(b.dataset.remove){let arr=state[b.dataset.remove+'Tags'];arr.splice(Number(b.dataset.index),1);render();root.querySelector('#cp-'+b.dataset.remove).focus();return}switch(b.dataset.action){case'theme':state.theme=getComputedStyle(root).colorScheme==='dark'||state.theme==='dark'?'light':'dark';render();break;case'close-drawer':closeDrawer();break;case'clear':modalFocus=b;toast.hidden=true;scrim.hidden=false;root.querySelector('.cp-shell').inert=true;scrim.querySelector('[data-action="cancel-clear"]').focus();break;case'cancel-clear':closeModal();break;case'confirm-clear':state.titleTags=[];state.contentTags=[];closeModal();render();root.querySelector('#cp-title')?.focus();notify('已清空筛选条件');break;case'dismiss-toast':toast.hidden=true;break;case'refresh':case'recheck':b.disabled=true;b.textContent='检查中…';setTimeout(()=>{render();notify(state.scenario==='error'?'Claude Code 仍未响应，请检查来源工具':state.scenario==='empty'?'尚未检测到接入':'接入状态已更新')},650);break}});
function addKeyword(form){let key=form.dataset.filter,input=form.querySelector('input'),value=input.value.trim(),err=form.querySelector('.cp-error'),arr=state[key+'Tags'];if(!value||arr.includes(value)||value.length>40){err.textContent=!value?'请输入关键词':arr.includes(value)?'这个关键词已经添加':'关键词最多 40 个字符';err.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return}arr.push(value);render();root.querySelector('#cp-'+key).focus()}
root.addEventListener('click',e=>{const b=e.target.closest('.cp-filter button');if(b){e.preventDefault();addKeyword(b.closest('.cp-filter'))}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.cp-filter input')){e.preventDefault();addKeyword(e.target.closest('.cp-filter'))}});
root.addEventListener('submit',e=>{if(e.target.matches('.cp-filter'))e.preventDefault()});
root.addEventListener('change',e=>{if(e.target.matches('.cp-mobile-nav')){closeDrawer();state.page=e.target.value;render()}if(e.target.dataset.setting){state[e.target.dataset.setting]=e.target.value;notify('提醒设置已保存')}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!scrim.hidden){closeModal();e.preventDefault()}else if(!drawer.hidden){closeDrawer();e.preventDefault()}}if(e.key==='Tab'&&!scrim.hidden){const buttons=[...scrim.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){buttons.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){buttons[0].focus();e.preventDefault()}}});
render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{closeDrawer();render()}});t.addSelect(state,'theme',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});t.addSelect(state,'scenario',{label:'接入场景',options:[{label:'正常 · 两个已接入',value:'normal'},{label:'异常 · 一个连接中断',value:'error'},{label:'空状态 · 尚未接入',value:'empty'}]})}
})();
</script>
