name: Provider protocol conformance
on:
  pull_request:
    paths: ['crates/codepet-host/**', 'sdk/**', 'protocol/**', 'tools/protocol-codegen/**', 'tools/cp-sdk-gen/**', 'scripts/sync_remote_sdk.mjs', 'scripts/*provider*', 'examples/providers/independent/**', '.github/workflows/provider-protocol.yml']
  push:
    branches: [main]
    paths: ['crates/codepet-host/**', 'sdk/**', 'protocol/**', 'tools/protocol-codegen/**', 'tools/cp-sdk-gen/**', 'scripts/sync_remote_sdk.mjs', 'scripts/*provider*', 'examples/providers/independent/**', '.github/workflows/provider-protocol.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-codegen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'checkout with spaces'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: 'checkout with spaces'
      - run: npm run protocol:check
        working-directory: 'checkout with spaces'
      - run: npm run providers:test
        working-directory: 'checkout with spaces'
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdk/rust
            crates
      - run: npm ci
      - run: node tools/protocol-codegen/generate.mjs --check
      - run: node --test scripts/export_provider_sdk.test.mjs scripts/stage_provider_plugins.test.mjs tools/protocol-codegen/test.mjs tools/protocol-codegen/provider-contract.test.mjs tools/protocol-codegen/modular-contract.test.mjs tools/protocol-codegen/compatibility.test.mjs
      - run: npm exec --yes --package=bun -- bun test tools/cp-sdk-gen/cp-sdk-gen.test.mjs
      - run: cargo test --manifest-path sdk/rust/Cargo.toml --workspace
      - run: cargo test --manifest-path crates/Cargo.toml -p codepet-host --test provider_profiles
      - run: cargo test --manifest-path crates/Cargo.toml -p codepet-host --lib gateway::provider_updates -- --test-threads=1
