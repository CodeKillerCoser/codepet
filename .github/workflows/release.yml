name: Release
run-name: Release Build ${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build workflow run ID. Publishes its existing artifacts without rebuilding.
        required: true
        type: string
      release_name:
        description: Optional release title.
        required: false
        type: string
      release_notes:
        description: Optional release notes.
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish existing build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid build run ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validateBuildRun } from './scripts/release_artifacts.mjs';
          validateBuildRun(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/build-run.json`, 'utf8')), process.env.BUILD_RUN_ID, process.env.GITHUB_REPOSITORY);
          JS
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: codepet-*
          merge-multiple: true
          path: dist/release-assets
          digest-mismatch: error
      - name: Validate complete build artifacts
        id: build
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: >-
          node scripts/release_artifacts.mjs validate --run-id "$BUILD_RUN_ID"
          --run-json "$RUNNER_TEMP/build-run.json" --repo "$GITHUB_REPOSITORY"
          --input dist/release-assets
      - name: Generate latest.json
        env:
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ steps.build.outputs.tag }}
          PLATFORM: ${{ steps.build.outputs.platform }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: >-
          node scripts/generate_latest_json.mjs
          --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION"
          --platform "$PLATFORM" --mac-updater disabled
          --artifacts dist/release-assets --output dist/latest.json --notes "$RELEASE_NOTES"
      - name: Publish validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.build.outputs.commit_sha }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_COMMIT"
          # Existing tags must identify the exact source used by Build, including annotated tags.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          printf '%s\n' "${RELEASE_NOTES:-Release $TAG}" > "$RUNNER_TEMP/release-notes.md"
          # A failed upload stays in a draft; retries never delete a published release's assets.
          if gh release view "$TAG" --json isDraft,targetCommitish,assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --arg commit "$RELEASE_COMMIT" '.isDraft == true and .targetCommitish == $commit' "$RUNNER_TEMP/release.json" > /dev/null || { echo "Release is already published or its draft targets a different commit."; exit 1; }
            while IFS= read -r asset; do
              [[ "$asset" == latest.json || -f "dist/release-assets/$asset" ]] || { echo "Draft has an unexpected asset: $asset"; exit 1; }
            done < <(jq -r '.assets[].name' "$RUNNER_TEMP/release.json")
          else
            gh release create "$TAG" --draft --target "$RELEASE_COMMIT" --title "${RELEASE_NAME:-Release $TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          mapfile -d '' ASSETS < <(find dist/release-assets -type f -print0)
          ASSETS+=(dist/latest.json)
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          gh release edit "$TAG" --draft=false --latest --title "${RELEASE_NAME:-Release $TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
