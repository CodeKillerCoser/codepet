name: Pet UI quality
on:
  pull_request:
    paths: ['frontend/**', 'scripts/pet_*qa*', 'package*.json', 'vite.config.*', '.github/workflows/pet-ui-quality.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/pet_*qa*', 'package*.json', 'vite.config.*', '.github/workflows/pet-ui-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dock-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEPET_QA_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pet
      - run: npm run test:pet:ui
      - run: npm run test:pet:motion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/pet_motion_images_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pet-ui-regression
          path: |
            artifacts/pet-notch-qa/*.png
            artifacts/pet-notch-qa/*.json
            artifacts/pet-motion-qa/*.png
            artifacts/pet-motion-qa/*.json
