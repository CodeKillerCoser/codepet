[package]
name = "code-pet"
version = "0.3.9-beta"
description = "Pixel desktop pet for Codex, Claude Code, and Qoder hooks"
authors = ["Code Pet Contributors"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "code_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "code-pet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
codepet-desktop-sdk = { path = "../sdk/rust/codepet-desktop-sdk", version = "0.1.0" }
codepet-gateway-sdk = { path = "../sdk/rust/codepet-gateway-sdk", version = "0.1.0" }
codepet-lan-channel-sdk = { path = "../sdk/rust/codepet-lan-channel-sdk", version = "0.1.0" }
codepet-host = { path = "../crates/codepet-host", version = "0.1.0" }
codepet-provider-sdk = { path = "../sdk/rust/codepet-provider-sdk", version = "0.1.0" }
dirs = "5"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
open = "5"
os_info = { version = "3.15", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6.4"
objc2-core-graphics = "0.3.2"
objc2-core-image = "0.3.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
tauri-nspanel = { path = "vendor/tauri-nspanel" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
