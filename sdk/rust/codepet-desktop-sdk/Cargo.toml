[package]
name = "codepet-desktop-sdk"
version = "0.1.0"
description = "Generated Rust SDK for the CodePet desktop-only runtime protocol"
authors = ["Code Pet Contributors"]
repository = "https://github.com/CodeKillerCoser/codepet"
edition = "2021"

[dependencies]
codepet-core-sdk = { path = "../codepet-core-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
