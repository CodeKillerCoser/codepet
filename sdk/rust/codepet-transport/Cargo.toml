[package]
name = "codepet-transport"
version = "0.1.0"
edition = "2021"
description = "Language-neutral stdio framing, compression and stream multiplexing"

[dependencies]
codepet-core-sdk = { path = "../codepet-core-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "=0.14.0"
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
