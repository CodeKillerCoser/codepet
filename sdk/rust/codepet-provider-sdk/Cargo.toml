[package]
name = "codepet-provider-sdk"
version = "0.1.0"
description = "Generated Rust SDK for out-of-process CodePet Provider plugins"
authors = ["Code Pet Contributors"]
repository = "https://github.com/CodeKillerCoser/codepet"
edition = "2021"
exclude = ["tests"]

[dependencies]
codepet-agent-sdk = { path = "../codepet-agent-sdk", version = "0.1.0" }
codepet-core-sdk = { path = "../codepet-core-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
