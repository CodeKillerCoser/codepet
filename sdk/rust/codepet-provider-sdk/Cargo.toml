[package]
name = "codepet-provider-sdk"
version = "0.1.0"
description = "Generated Rust SDK for out-of-process CodePet Provider plugins"
authors = ["Code Pet Contributors"]
repository = "https://github.com/CodeKillerCoser/codepet"
edition = "2021"
exclude = ["tests"]

[dependencies]
codepet-agent-sdk = { path = "../codepet-agent-sdk", version = "0.1.0" }
codepet-core-sdk = { path = "../codepet-core-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util", "process"] }
zstd = "0.13"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "=0.14.0"
dirs = "6"
process-wrap = { version = "10", features = ["std", "tokio1"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net"] }
